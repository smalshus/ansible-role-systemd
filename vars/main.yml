---
_default_unit_path: "/etc/systemd/system"
_default_unit_type: "service"
_default_unit_enabled: "no"
_default_systemd_backup_files: true
_default_unit_state: "stopped"
_default_unit_user: "root"
_default_unit_scope: "system"
# PID 1 / system-manager load paths — incompatible with scope=user.
_pid1_unit_path_prefixes:
  - /etc/systemd/system
  - /run/systemd/system
  - /usr/lib/systemd/system
  - /usr/local/lib/systemd/system
  - /lib/systemd/system
