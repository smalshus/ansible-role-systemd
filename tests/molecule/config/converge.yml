---
- name: Systemd unit configuration integration test playbook
  hosts: all
  pre_tasks:
    - name: Create per-user unit test account
      ansible.builtin.user:
        name: sduser
        create_home: true
        shell: /bin/bash

    - name: Resolve passwd entries
      ansible.builtin.getent:
        database: passwd

    - name: Enable linger for sduser
      ansible.builtin.command:
        cmd: loginctl enable-linger sduser
        creates: /var/lib/systemd/linger/sduser

    - name: Start user manager for sduser
      ansible.builtin.systemd:
        name: "user@{{ ansible_facts.getent_passwd['sduser'][1] }}.service"
        state: started

    - name: Wait for sduser runtime directory
      ansible.builtin.wait_for:
        path: "/run/user/{{ ansible_facts.getent_passwd['sduser'][1] }}"
        timeout: 30
  roles:
    - role: ansible-role-systemd
      vars:
        unit_config:
          - name: "default-test-service"
            path: "/usr/local/lib/systemd/system"
            Unit:
              Description: "This is a default test service unit"
            Service:
              ExecStart: '/usr/bin/sleep infinity'
            Install:
              WantedBy: 'multi-user.target'
          - name: "test-service"
            state: started
            enabled: "yes"
            Unit:
              Description: "This is a test service unit which listens at port 1234"
              After: network-online.target
              Wants: network-online.target
              Requires: test-service.socket
            Service:
              User: 'root'
              Group: 'root'
              ExecStart: '/usr/bin/sleep infinity'
              ExecReload: '/bin/kill -s HUP $MAINPID'
            Install:
              WantedBy: 'multi-user.target'
          - name: "test-service"
            type: "socket"
            Unit:
              Description: "This is a test socket unit which specifies the test-service 'socket' unit type"
            Socket:
              ListenStream: '0.0.0.0:1234'
              Accept: 'true'
            Install:
              WantedBy: 'sockets.target'
          - name: "tmp-stdin"
            type: "mount"
            path: "/run/systemd/system"
            Unit:
              Description: "This is a test mount unit which overrides the default unit path"
            Mount:
              What: '/dev/stdin'
              Where: '/tmp/stdin'
            Install:
              WantedBy: 'test-target.target'
          - name: "test-target"
            type: "target"
            path: "/etc/systemd/system"
            Unit:
              Description: This is an example unit Target
              Wants: test-service.service test-service.socket tmp-stdin.mount
              PartOf: test-service.service
          - name: "test-drop-in"
            type: "conf"
            path: "/lib/systemd/system/getty@.service.d"
            Service:
              ExecStart:
                - ""
                - "-/sbin/agetty -a muru --noclear %I $TERM"
          - name: "user-test-service"
            path: "/home/sduser/.config/systemd/user"
            user: sduser
            group: sduser
            scope: user
            state: stopped
            enabled: false
            Unit:
              Description: "This is a per-user test service unit"
            Service:
              ExecStart: '/usr/bin/sleep infinity'
            Install:
              WantedBy: 'default.target'
