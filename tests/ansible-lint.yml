---
# see for details: https://docs.ansible.com/ansible-lint/index.html
exclude_paths:
  - .git/
  - .github/
  - .venv/
  - tests/molecule/
warn_list:
  - experimental
  # Galaxy FQN is 0x0i.systemd; meta cannot declare that namespace
  # (namespaces must start with a letter) without breaking Galaxy import.
  - role-name
